<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0f2438"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.12" r="0.6">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#67e8f9" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- accent rule -->
  <rect x="80" y="150" width="64" height="6" rx="3" fill="url(#accent)"/>

  <text x="80" y="132" font-family="Inter, Segoe UI, sans-serif" font-size="26" letter-spacing="7" fill="#67e8f9" font-weight="700">A TECHNICAL BOOK</text>

  <text x="78" y="290" font-family="Georgia, 'Source Serif 4', serif" font-size="92" font-weight="700" fill="#f8fafc">Physical AI</text>
  <text x="78" y="392" font-family="Georgia, 'Source Serif 4', serif" font-size="92" font-weight="700" font-style="italic" fill="#67e8f9">&amp; Humanoid Robotics</text>

  <text x="80" y="470" font-family="Inter, Segoe UI, sans-serif" font-size="32" fill="#c9d4e3">From perception and control to a working, AI-commanded humanoid.</text>

  <text x="80" y="556" font-family="Inter, Segoe UI, sans-serif" font-size="26" font-weight="700" fill="#e0f2fe">Muhammad Umer Akmal</text>
  <text x="80" y="590" font-family="Inter, Segoe UI, sans-serif" font-size="20" letter-spacing="3" fill="#9cc6d9">FIRST EDITION</text>

  <!-- stylised robot -->
  <g transform="translate(980,300)">
    <rect x="-46" y="-150" width="92" height="80" rx="22" fill="url(#accent)"/>
    <circle cx="-18" cy="-108" r="10" fill="#062a30"/>
    <circle cx="18" cy="-108" r="10" fill="#062a30"/>
    <rect x="-60" y="-58" width="120" height="140" rx="26" fill="#0e7490"/>
    <rect x="-60" y="-58" width="120" height="140" rx="26" fill="none" stroke="#67e8f9" stroke-opacity="0.4" stroke-width="2"/>
    <rect x="-96" y="-52" width="24" height="112" rx="12" fill="url(#accent)"/>
    <rect x="72" y="-96" width="24" height="112" rx="12" fill="url(#accent)" transform="rotate(28 84 -40)"/>
    <rect x="-40" y="82" width="28" height="120" rx="13" fill="#155e75"/>
    <rect x="12" y="82" width="28" height="120" rx="13" fill="#155e75"/>
  </g>
</svg>
